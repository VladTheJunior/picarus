[package]
name = "picarus"
version = "0.0.0-dev"
edition = "2024"
build = "build.rs"

[package.metadata.winresource]
OriginalFilename = "picarus.exe"
LegalCopyright = "Copyright © VladTheJunior, 2026"
FileDescription = "Interactive items viewer for Riders of Icarus"

[dependencies.gpui-kit]
version = "=0.7.0"
features = ["tree-sitter"]

[dependencies.scraper]
version = "=0.27.0"

[dependencies.image-extras]
version = "=0.1.1"
default-features = false
features = ["dds"]

[dependencies.image]
version = "=0.25.10"
default-features = false

[dependencies.enum_dispatch]
version = "=0.3.13"

[dependencies.itertools]
version = "=0.15.0"

[dependencies.lz4_flex]
version = "=0.14.0"
default-features = false
features = ["alloc"]

[dependencies.quick-xml]
version = "=0.42.0"
features = ["serialize", "encoding"]

[dependencies.rust_xlsxwriter]
version = "=0.99.1"
features = ["serde", "zlib", "zmij"]

[dependencies.tracing]
version = "=0.1.44"

[dependencies.tracing-subscriber]
version = "=0.3.23"
features = ["env-filter"]

[dependencies.rust_decimal]
version = "=1.43.0"
features = ["macros"]

[dependencies.zip]
version = "=8.6.0"

[dependencies.fluent]
version = "=0.17.0"

[dependencies.unic-langid]
version = "=0.9.6"
features = ["macros"]

[dependencies.tokio]
version = "=1.53.1"
features = ["macros", "rt-multi-thread", "fs", "io-util", "time"]

[dependencies.anyhow]
version = "=1.0.104"

[dependencies.serde_json]
version = "=1.0.151"

[dependencies.serde]
version = "=1.0.229"
features = ["derive"]

[dependencies.strum]
version = "=0.28.0"
features = ["derive"]

[dependencies.toml]
version = "=1.1.6"

[dependencies.encoding_rs]
version = "=0.8.42"

[dependencies.sys-locale]
version = "=0.3.2"

[dependencies.indexmap]
version = "=2.14.2"

[dependencies.regex]
version = "=1.13.1"

[build-dependencies]
winresource = "=0.1.31"
vergen-gitcl = { version = "=10.0.3", features = ["build", "cargo", "rustc"] }

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"


[profile.dev]
opt-level = 0
incremental = true
codegen-units = 256
